name: EdgeCare
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
packages:
  EdgeCareCore:
    path: packages/edgecare-core
targetTemplates:
  EdgeCareApp:
    type: application
    platform: iOS
    dependencies:
      - package: EdgeCareCore
        product: EdgeCareCore
      - package: EdgeCareCore
        product: EdgeCareUI
    info:
      path: apps/Info.plist
      properties:
        NSCameraUsageDescription: Read a letter or add a skin concern on this device. Photos are not uploaded.
        NSMicrophoneUsageDescription: With consent, voice intake streams audio to Google Gemini; translated doctor consultations use ElevenLabs and Google Gemini. Consultation audio is not stored. You can use the form offline.
        NSSpeechRecognitionUsageDescription: Optional form dictation uses Apple on-device recognition. Online conversation is a separate consent-based service.
        NSLocalNetworkUsageDescription: Connect to the shared Edge-Care demo backend on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: YES
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: YES
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
targets:
  EdgeCareKiosk:
    templates: [EdgeCareApp]
    sources: [apps/kiosk-ios/Sources]
    info:
      path: apps/kiosk-ios/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edgecare.demo.kiosk
        TARGETED_DEVICE_FAMILY: "2"
  EdgeCareDoctor:
    templates: [EdgeCareApp]
    sources: [apps/doctor-ios/Sources]
    info:
      path: apps/doctor-ios/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edgecare.demo.doctor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [EdgeCareDoctorTests]
  EdgeCareDoctorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/doctor-ios/Tests]
    dependencies:
      - target: EdgeCareDoctor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edgecare.demo.doctor.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EdgeCareDoctor.app/EdgeCareDoctor"
        BUNDLE_LOADER: "$(TEST_HOST)"
  EdgeCarePatient:
    templates: [EdgeCareApp]
    sources: [apps/patient-ios/Sources]
    info:
      path: apps/patient-ios/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edgecare.demo.patient
        TARGETED_DEVICE_FAMILY: "1"
