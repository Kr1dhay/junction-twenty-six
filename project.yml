name: EdgeCare
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
packages:
  EdgeCareCore:
    path: packages/edgecare-core
targetTemplates:
  EdgeCareApp:
    type: application
    platform: iOS
    dependencies:
      - package: EdgeCareCore
        product: EdgeCareCore
      - package: EdgeCareCore
        product: EdgeCareUI
    info:
      path: apps/Info.plist
      properties:
        NSCameraUsageDescription: Read a letter on this device, or add a skin concern photo. With your consent, a skin photo is sent to the Edge-Care server and Google Gemini for a demo risk estimate and is not stored.
        NSMicrophoneUsageDescription: With consent, voice intake streams audio to Google Gemini; translated doctor consultations use ElevenLabs and Google Gemini. Consultation audio is not stored. You can use the form offline.
        NSSpeechRecognitionUsageDescription: Optional form dictation uses Apple on-device recognition. Online conversation is a separate consent-based service.
        NSLocalNetworkUsageDescription: Connect to the shared Edge-Care demo backend on your local network.
        # Filled from the build settings below; empty on simulator builds, so
        # simulators keep their launch-environment behaviour.
        EDGECARE_MODE: $(EDGECARE_MODE)
        EDGECARE_BASE_URL: $(EDGECARE_BASE_URL)
        EDGECARE_ISSUER_TOKEN: $(EDGECARE_ISSUER_TOKEN)
        EDGECARE_CLINICIAN_TOKEN: $(EDGECARE_CLINICIAN_TOKEN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: YES
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: YES
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        # Physical-device builds connect to the hosted demo (edgecare-device.json)
        # when opened from the home screen. Explicit launch values still win.
        "EDGECARE_MODE[sdk=iphoneos*]": connected
        "EDGECARE_BASE_URL[sdk=iphoneos*]": https://edgecare-lissankoiralas-projects.vercel.app
targets:
  EdgeCareKiosk:
    templates: [EdgeCareApp]
    sources: [apps/kiosk-ios/Sources]
    info:
      path: apps/kiosk-ios/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edgecare.demo.kiosk
        TARGETED_DEVICE_FAMILY: "2"
        "EDGECARE_ISSUER_TOKEN[sdk=iphoneos*]": uFYko9nDhzJ9eSKcbVClOYLFbl7lOGRumjjkDj_pnkYk6rUzPON78m-UjqkZxuyp
        "EDGECARE_CLINICIAN_TOKEN[sdk=iphoneos*]": ZzstM5BpioZsGo93z2fTr8oMkkUY4ALwMUpFt0ITToQ9zr3Ld3uToSe-phR_xpi9
  EdgeCareDoctor:
    templates: [EdgeCareApp]
    sources: [apps/doctor-ios/Sources]
    info:
      path: apps/doctor-ios/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edgecare.demo.doctor
        TARGETED_DEVICE_FAMILY: "1,2"
        "EDGECARE_CLINICIAN_TOKEN[sdk=iphoneos*]": ZzstM5BpioZsGo93z2fTr8oMkkUY4ALwMUpFt0ITToQ9zr3Ld3uToSe-phR_xpi9
    scheme:
      testTargets: [EdgeCareDoctorTests]
  EdgeCareDoctorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/doctor-ios/Tests]
    dependencies:
      - target: EdgeCareDoctor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edgecare.demo.doctor.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EdgeCareDoctor.app/EdgeCareDoctor"
        BUNDLE_LOADER: "$(TEST_HOST)"
  EdgeCarePatient:
    templates: [EdgeCareApp]
    sources: [apps/patient-ios/Sources]
    info:
      path: apps/patient-ios/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edgecare.demo.patient
        TARGETED_DEVICE_FAMILY: "1"
        "EDGECARE_ISSUER_TOKEN[sdk=iphoneos*]": uFYko9nDhzJ9eSKcbVClOYLFbl7lOGRumjjkDj_pnkYk6rUzPON78m-UjqkZxuyp
        "EDGECARE_CLINICIAN_TOKEN[sdk=iphoneos*]": ZzstM5BpioZsGo93z2fTr8oMkkUY4ALwMUpFt0ITToQ9zr3Ld3uToSe-phR_xpi9
  EdgeCareDesignReviewTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/design-review-tests]
    dependencies:
      - target: EdgeCareKiosk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edgecare.demo.design-review
        TEST_TARGET_NAME: EdgeCareKiosk
schemes:
  EdgeCareDesignReview:
    build:
      targets:
        EdgeCareKiosk: all
        EdgeCareDesignReviewTests: [test]
    test:
      targets: [EdgeCareDesignReviewTests]
