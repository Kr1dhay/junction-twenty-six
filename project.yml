name: EdgeCare
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
packages:
  EdgeCareCore:
    path: packages/edgecare-core
targetTemplates:
  EdgeCareApp:
    type: application
    platform: iOS
    dependencies:
      - package: EdgeCareCore
        product: EdgeCareCore
      - package: EdgeCareCore
        product: EdgeCareUI
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
targets:
  EdgeCareKiosk:
    templates: [EdgeCareApp]
    sources: [apps/kiosk-ios/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edgecare.demo.kiosk
        TARGETED_DEVICE_FAMILY: "2"
  EdgeCareDoctor:
    templates: [EdgeCareApp]
    sources: [apps/doctor-ios/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edgecare.demo.doctor
        TARGETED_DEVICE_FAMILY: "1,2"
  EdgeCarePatient:
    templates: [EdgeCareApp]
    sources: [apps/patient-ios/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edgecare.demo.patient
        TARGETED_DEVICE_FAMILY: "1"
